- name: Server startup update and Python 3 installation for Ansible
  hosts: webservers
  # Plain Ubuntu containers run as root and do not contain sudo or Python.
  become: false
  gather_facts: false

  tasks:
    - name: Bootstrap Python 3 and pip
      ansible.builtin.raw: >-
        DEBIAN_FRONTEND=noninteractive apt-get update &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip
      changed_when: false

    - name: Update the APT package cache
      ansible.builtin.apt:
        update_cache: true

    - name: Verify Python installation
      ansible.builtin.command: python3 --version
      register: python_version
      changed_when: false

    - name: Display Python version
      ansible.builtin.debug:
        msg: "Python version: {{ python_version.stdout }}"
